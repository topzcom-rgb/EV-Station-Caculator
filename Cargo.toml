[package]
name = "ev-station-calculator"
version = "0.1.0"
edition = "2024"

[lib]
name = "ev_station_calculator"
crate-type = ["cdylib", "rlib"]

[features]
default = []
gui = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
rfd = "0.17.2"
rust_xlsxwriter = "0.99.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
rust_xlsxwriter = { version = "0.99.1", features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlElement", "HtmlCanvasElement", "Blob", "BlobPropertyBag", "Url"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
