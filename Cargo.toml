[package]
name = "ev-station-calculator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[features]
default = []
gui = []

[dependencies]
egui = { version = "0.36.2", default-features = false }
rfd = "0.17.2"
rust_xlsxwriter = "0.99.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = "z"
lto = true
strip = true
